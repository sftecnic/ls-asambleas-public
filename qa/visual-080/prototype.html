</style><div class="prototype-note">Prototipo · Datos ficticios · No guarda datos</div><div class="shell"><nav><img src="../../public/brand/symbol.svg" alt=""><strong>LS Asambleas</strong><div id="nav"></div></nav><section><header class="context"><select aria-label="Evento"><option>Asamblea de circuito · Oviedo</option><option>Asamblea de circuito · Zaragoza</option></select><p>10 de abril de 2027<small>Salón del Norte · Oviedo</small></p></header><main id="main"></main></section></div><dialog id="person"><div class="head"><h2>Lucía Martín</h2><button data-close>Cerrar</button></div><div class="tabs" id="person-tabs"></div><div id="person-content"></div></dialog>
<script>
const icons={Inicio:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',Equipo:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5"/>',Turnos:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>',Agenda:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8m-8 5h8m-8 5h5"/>',Plataforma:'<path d="M3 4h18v13H3zM12 17v4m-4 0h8"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[n]+'</svg>';
let page='Inicio';const nav=document.querySelector('#nav'),main=document.querySelector('#main');nav.style.display='contents';
const labels=['Inicio','Equipo','Turnos','Agenda','Plataforma'];
function render(){nav.innerHTML=labels.map(n=>`<button aria-pressed="${page===n}" data-page="${n}">${icon(n)} <span>${n}</span></button>`).join('');main.innerHTML=views[page]();}
const personRow=(name,role)=>`<div class="row"><div><h3>${name}</h3><span class="muted">${role} · Norte LSE</span><p><span class="state">✓ Comité aprobado</span> <span class="state">✓ Aceptado</span></p></div><button data-person>Ver ficha</button></div>`;
const views={Inicio:()=>`<div class="head"><h1>Inicio</h1><select aria-label="Departamento"><option>Audio y vídeo</option><option>Toda la asamblea</option></select></div><div class="cols"><section class="panel"><h2>Requiere atención</h2><div class="row"><span>Comité pendiente</span><button data-page="Equipo">2 · Ver</button></div><div class="row"><span>Turnos por publicar</span><button data-page="Turnos">1 · Ver</button></div></section><section class="panel"><h2>Lo próximo para ti</h2><p>10 de abril de 2027</p><div class="large">10:00–12:00</div><h3 class="post">Cámara</h3><p>Encuentro · 09:30</p><p>Cabina de Audio y vídeo</p><button data-page="Turnos">Ver turno</button></section></div><section class="panel"><h2>Tu departamento</h2><div class="row"><div>Responsable<strong> · Elena Vidal</strong></div><button data-page="Equipo">Ver equipo</button></div><div class="photo">Audio y vídeo</div><button>Conocer departamento</button></section>`,Equipo:()=>`<div class="head"><h1>Equipo</h1><button class="primary">Añadir persona</button></div><div class="tools"><input aria-label="Buscar" placeholder="Buscar persona"><select aria-label="Departamento"><option>Audio y vídeo</option></select><button>Filtros</button></div><p class="muted">3 personas · 1 sorda · 2 oyentes</p><div class="panel">${personRow('Elena Vidal','Responsable')}${personRow('Lucía Martín','Auxiliar')}${personRow('Marcos León','Voluntario')}</div>`,Turnos:()=>`<div class="head"><h1>Turnos</h1><button class="primary">Añadir turno</button></div><section class="panel"><h2>Audio y vídeo</h2><p>Responsable · Elena Vidal</p><p>Auxiliar · Lucía Martín</p><h3>Mañana · 10:00–12:00</h3><p>Encuentro · Cabina · 09:30</p>${['Director','Mesa','Vídeo','Cámara'].map((p,i)=>`<div class="row"><div><h3>${p}</h3><p>${['Elena Vidal','Lucía Martín','Marcos León','David Romero'][i]}</p><span class="state">✓ Publicado</span></div><div><div class="controls" data-attendance><button aria-pressed="true">Sin marcar</button><button>Presente</button><button>Ausente</button></div><button data-person>Editar</button></div></div>`).join('')}</section>`,Agenda:()=>`<div class="head"><h1>Agenda</h1><button class="primary">Añadir</button></div><div class="tabs"><button aria-pressed="true">Programa</button><button>Reuniones</button></div><section class="panel">${[['10:00','Bienvenida','Andrés Ríos'],['10:10','Aprendamos juntos','Lucía Martín'],['12:00','Descanso','']].map(([t,title,p])=>`<div class="row"><strong class="large">${t}</strong><div><h3>${title}</h3><p>${p}</p><span class="state">✓ Publicado</span></div><button data-page="Plataforma">Ver detalle</button></div>`).join('')}</section>`,Plataforma:()=>`<div class="head"><button data-page="Agenda">Volver</button><h1>Entrevista</h1><span class="muted">Borrador</span><button>Deshacer</button><button class="primary">Guardar</button></div><div class="tabs"><button aria-pressed="true">1 · Inicio</button><button>2 · Entrevista</button><button>Duplicar</button></div><div class="stage"><section class="panel"><h2>Añadir</h2><button>Persona</button><button>Silla</button><button>Mesa</button><button>Atril</button></section><div class="canvas"><svg viewBox="0 0 600 360" aria-label="Plano ficticio"><rect x="20" y="20" width="560" height="290" rx="10" fill="#eef2f6"/><circle cx="210" cy="140" r="24" fill="#1d4ed8"/><path d="M180 220v-40a30 30 0 0 1 60 0v40" fill="#1d4ed8"/><circle cx="390" cy="140" r="24" fill="#475569"/><path d="M360 220v-40a30 30 0 0 1 60 0v40" fill="#475569"/><text x="300" y="340" text-anchor="middle" font-size="22" fill="#172b4d">Público</text></svg></div><section class="panel"><h2>Persona</h2><button>De pie</button><button>Sentada</button><button>Mirar al público</button></section></div>`};
function personTab(tab='Datos'){document.querySelector('#person-tabs').innerHTML=['Datos','Equipo','Acceso'].map(t=>`<button data-tab="${t}" aria-pressed="${t===tab}">${t}</button>`).join('');document.querySelector('#person-content').innerHTML=tab==='Datos'?'<p>Norte LSE</p><p>Oyente · Nombramiento sin indicar</p><label>Nombre completo<input value="Lucía Martín"></label><button class="primary">Guardar ficha</button>':tab==='Equipo'?'<h3>Audio y vídeo</h3><p>Auxiliar</p><p class="state">✓ Comité aprobado</p><p class="state">✓ Voluntaria aceptada</p>':'<h3>Acceso</h3><p class="state">✓ Activo</p><p>persona@example.test</p>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();window.scrollTo(0,0);}if(b.hasAttribute('data-person')){personTab();document.querySelector('#person').showModal();}if(b.dataset.tab)personTab(b.dataset.tab);if(b.hasAttribute('data-close'))document.querySelector('#person').close();if(b.parentElement.hasAttribute('data-attendance'))for(const x of b.parentElement.children)x.setAttribute('aria-pressed',String(x===b));});render();
</script></html>
